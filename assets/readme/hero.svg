<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Skills For Real Engineers</title>
  <desc id="hero-desc">Joao's daily agent skills for real engineering, not vibe coding. A terminal panel lists the main flow from idea to ship: /grill-with-docs, /to-spec, /to-tickets, /implement, /retro.</desc>

  <rect width="1200" height="400" rx="26" fill="#0E1116"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="1.5" fill="#8B93A1"><tspan fill="#7CE0B0" font-weight="700">/</tspan> agent skills</text>
    <text x="0" y="178" font-size="72" font-weight="800" fill="#F4F1EA" letter-spacing="-1.5">Skills for</text>
    <text x="0" y="252" font-size="72" font-weight="800" fill="#F4F1EA" letter-spacing="-1.5">Real Engineers<tspan fill="#7CE0B0">.</tspan></text>
    <text x="0" y="310" font-size="26" fill="#C9CDD4">My daily agent skills for real engineering,</text>
    <text x="0" y="344" font-size="26" fill="#C9CDD4">not vibe coding.</text>
  </g>

  <g id="main-flow" transform="translate(700 48)">
    <rect width="436" height="304" rx="18" fill="#161B22" stroke="#262D38" stroke-width="2"/>
    <text x="32" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B93A1" letter-spacing="1">main flow: idea → ship</text>
    <line x1="32" y1="64" x2="404" y2="64" stroke="#262D38" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B93A1">
      <text x="32" y="106">01</text>
      <text x="32" y="144">02</text>
      <text x="32" y="182">03</text>
      <text x="32" y="220">04</text>
      <text x="32" y="258">05</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="700" fill="#7CE0B0">
      <text x="80" y="108">/grill-with-docs</text>
      <text x="80" y="146">/to-spec</text>
      <text x="80" y="184">/to-tickets</text>
      <text x="80" y="222">/implement</text>
      <text x="80" y="260">/retro</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#8B93A1" text-anchor="end">
      <text x="404" y="106">align</text>
      <text x="404" y="144">spec</text>
      <text x="404" y="182">split</text>
      <text x="404" y="220">tdd + review</text>
      <text x="404" y="258">improve</text>
    </g>
    <rect x="80" y="274" width="14" height="6" fill="#7CE0B0"/>
  </g>
</svg>
