<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">The main flow, idea to ship</title>
  <desc id="wf-desc">Main flow: /grill-with-docs, /to-spec, /to-tickets, /implement (which drives /tdd and /code-review), /retro. Side entrances: /prototype detours from grilling, /wayfinder feeds /to-spec, /triage feeds /implement, /diagnosing-bugs leads to /retro.</desc>

  <rect width="1200" height="480" rx="26" fill="#F4F1EA"/>
  <text x="30" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#12805A">MAIN FLOW</text>

  <g stroke="#12805A" stroke-width="3" stroke-linecap="round">
    <line x1="246" y1="130" x2="261" y2="130"/>
    <line x1="477" y1="130" x2="492" y2="130"/>
    <line x1="708" y1="130" x2="723" y2="130"/>
    <line x1="939" y1="130" x2="954" y2="130"/>
  </g>
  <g>
    <rect x="30" y="76" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="46" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#12805A">/grill-with-docs</text>
    <text x="46" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#0E1116">Align on the idea</text>
  </g>
  <g>
    <rect x="261" y="76" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="277" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#12805A">/to-spec</text>
    <text x="277" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#0E1116">Write the spec</text>
  </g>
  <g>
    <rect x="492" y="76" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="508" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#12805A">/to-tickets</text>
    <text x="508" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#0E1116">Split into tickets</text>
  </g>
  <g>
    <rect x="723" y="76" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="739" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#12805A">/implement</text>
    <text x="739" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#0E1116">Build, then review</text>
    <text x="739" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5A6270">tdd + code-review</text>
  </g>
  <g>
    <rect x="954" y="76" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#12805A" stroke-width="2"/>
    <text x="970" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#12805A">/retro</text>
    <text x="970" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#0E1116">Improve the setup</text>
  </g>
  <g stroke="#5A6270" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M138 304V210m-8 8l8-8 8 8"/>
    <path d="M369 304V210m-8 8l8-8 8 8"/>
    <path d="M831 304V210m-8 8l8-8 8 8"/>
    <path d="M1062 304V210m-8 8l8-8 8 8"/>
  </g>
  <g>
    <rect x="30" y="304" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
    <text x="46" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#0E1116">/prototype</text>
    <text x="46" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">Needs a runnable</text>
    <text x="46" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">answer</text>
  </g>
  <g>
    <rect x="261" y="304" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
    <text x="277" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#0E1116">/wayfinder</text>
    <text x="277" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">Too big for one</text>
    <text x="277" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">session</text>
  </g>
  <g>
    <rect x="723" y="304" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
    <text x="739" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#0E1116">/triage</text>
    <text x="739" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">Raw bugs and</text>
    <text x="739" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">requests</text>
  </g>
  <g>
    <rect x="954" y="304" width="216" height="124" rx="16" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
    <text x="970" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#0E1116">/diagnosing-bugs</text>
    <text x="970" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">Something's broken,</text>
    <text x="970" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#5A6270">fix, then retro</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#5A6270" text-anchor="middle">
    <text x="600" y="360">ON-RAMPS</text>
    <text x="600" y="386">AND DETOURS</text>
  </g>
</svg>
