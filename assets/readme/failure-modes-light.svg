<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="fm-title fm-desc">
  <title id="fm-title">Four ways coding agents fail, and the skill for each</title>
  <desc id="fm-desc">The agent did not do what you wanted: /grill-with-docs. The agent is too verbose: a shared language in GLOSSARY.md, built by /grill-with-docs. The code does not work: /tdd and /diagnosing-bugs. A ball of mud: /improve-codebase-architecture, plus /to-spec.</desc>

  <rect width="1200" height="640" rx="26" fill="#F4F1EA"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5">
    <text x="64" y="66" fill="#D4452B">AGENT FAILS</text>
    <text x="640" y="66" fill="#12805A">REACH FOR</text>
  </g>
  <line x1="64" y1="86" x2="1136" y2="86" stroke="#D9D4C7" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(0 112)">
      <rect x="64" y="0" width="6" height="96" rx="3" fill="#D4452B"/>
      <text x="92" y="38" font-size="30" font-weight="700" fill="#0E1116">It didn't do what I want</text>
      <text x="92" y="74" font-size="20" fill="#5A6270">Misalignment: it never understood you.</text>
      <path d="M552 48h48m-14-14l14 14-14 14" fill="none" stroke="#5A6270" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="640" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#12805A">/grill-with-docs</text>
      <text x="640" y="74" font-size="20" fill="#5A6270">Get grilled before it builds.</text>
    </g>
    <g transform="translate(0 232)">
      <rect x="64" y="0" width="6" height="96" rx="3" fill="#D4452B"/>
      <text x="92" y="38" font-size="30" font-weight="700" fill="#0E1116">It's way too verbose</text>
      <text x="92" y="74" font-size="20" fill="#5A6270">20 words where 1 will do.</text>
      <path d="M552 48h48m-14-14l14 14-14 14" fill="none" stroke="#5A6270" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="640" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#12805A">/grill-with-docs</text>
      <text x="640" y="74" font-size="20" fill="#5A6270">A shared language in GLOSSARY.md.</text>
    </g>
    <g transform="translate(0 352)">
      <rect x="64" y="0" width="6" height="96" rx="3" fill="#D4452B"/>
      <text x="92" y="38" font-size="30" font-weight="700" fill="#0E1116">The code doesn't work</text>
      <text x="92" y="74" font-size="20" fill="#5A6270">No feedback loop: it flies blind.</text>
      <path d="M552 48h48m-14-14l14 14-14 14" fill="none" stroke="#5A6270" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="640" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700" fill="#12805A">/tdd  /diagnosing-bugs</text>
      <text x="640" y="74" font-size="20" fill="#5A6270">Red, green, refactor. Loop first.</text>
    </g>
    <g transform="translate(0 472)">
      <rect x="64" y="0" width="6" height="96" rx="3" fill="#D4452B"/>
      <text x="92" y="38" font-size="30" font-weight="700" fill="#0E1116">We built a ball of mud</text>
      <text x="92" y="74" font-size="20" fill="#5A6270">Agents speed up software entropy.</text>
      <path d="M552 48h48m-14-14l14 14-14 14" fill="none" stroke="#5A6270" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="640" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#12805A">/improve-codebase-architecture</text>
      <text x="640" y="74" font-size="20" fill="#5A6270">Plus /to-spec: design before you build.</text>
    </g>
  </g>
</svg>
